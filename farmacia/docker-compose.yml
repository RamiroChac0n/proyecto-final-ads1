version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - app_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=farmacia
      - DB_USER=user
      - DB_PASS=pass

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: farmacia
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d farmacia"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_net:

volumes:
  pgdata:
