<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Inicio de Sesión</title>
    </h:head>
    <h:body>
        <p:growl id="growl" showDetail="true" />

        <h:form id="loginForm">
            <p:panel header="Iniciar Sesión">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="username" value="Usuario:" />
                    <p:inputText id="username" value="#{userController.username}" required="true" label="usuario" autocomplete="on"/>

                    <p:outputLabel for="password" value="Contraseña:" />
                    <p:password id="password" value="#{userController.password}" required="true" label="contraseña" autocomplete="on"/>

                    <f:facet name="footer">
                        <p:commandButton value="Ingresar" action="#{userController.login}" update="growl"/>
                    </f:facet>
                </h:panelGrid>
            </p:panel>
        </h:form>
    </h:body>
</html>
