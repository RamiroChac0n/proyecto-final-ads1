<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
    <f:event type="preRenderView" listener="#{userController.checkLogin}" />
    <h:head>
        <title>Home</title>
    </h:head>
    <h:body>
        <div class="card">
            <h:form>
                <p:tabMenu activeIndex="#{menuController.userActiveTabIndex}">
                    <p:menuitem value="Home" outcome="home" icon="pi pi-fw pi-home" />
                    <p:menuitem value="User Management" outcome="index" 
                               icon="pi pi-fw pi-users" rendered="#{menuController.isAdmin()}" />
                    <p:menuitem value="Product Management" outcome="products" 
                               icon="pi pi-fw pi-shopping-cart" rendered="#{menuController.isAdmin()}" />
                    <p:menuitem value="Profile" outcome="" icon="pi pi-fw pi-user" />
                    <p:menuitem value="Settings" outcome="" icon="pi pi-fw pi-cog" />
                    <p:menuitem value="Logout" action="#{menuController.logout}" icon="pi pi-fw pi-sign-out" />
                </p:tabMenu>
            </h:form>
        </div>        
        <h1>Welcome, #{userController.user.firstName}</h1>
        <p>Use the menu above to navigate through the application.</p>
    </h:body>
</html>
